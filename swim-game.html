<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السبّاح الماهر 🏊</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8f6ff;--tx:#07304d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06182a;--tx:#e3f4ff}}
:root[data-theme="dark"]{--bg:#06182a;--tx:#e3f4ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;text-align:center;padding:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{font-size:20px;margin:2px 0 6px}
canvas{display:block;margin:0 auto;border-radius:16px;touch-action:none;width:min(100%,calc((100vh - 140px)*.6923));height:auto}
p{font-size:13px;opacity:.85;margin:6px}
button{font:inherit;border:0;border-radius:10px;padding:6px 12px;background:#0288d1;color:#fff}
</style>
</head>
<body>
<h1>🏊 السبّاح الماهر</h1>
<canvas id="c" width="360" height="520"></canvas>
<p>اضغط مطوّلًا للصعود بقوة والقفز من الماء 🐬 (حلقات 🪙 في الجو)، وأفلت للنزول • 🫧 درع • 🧲 مغناطيس • تتابع الجمع يضاعف نقاطك</p>
<button id="snd">🔊 الصوت</button>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=360,H=520,WY=170;
let dr=[],st='ready',hold=false,p,obs,bub,fx,score,lives,fr,best=0,inv,spd,combo,shield,magnet,shake,mute=false,ac=null;
try{best=+localStorage.getItem('swimBest')||0}catch(e){}
bub=Array.from({length:20},()=>({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*5,v:.3+Math.random()}));
function beep(f,d,t){if(mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
document.getElementById('snd').onclick=e=>{mute=!mute;e.target.textContent=mute?'🔇 الصوت':'🔊 الصوت'};
function init(){p={x:80,y:H/2,vy:0,af:0,fl:0};dr=[];obs=[];fx=[];score=0;lives=3;fr=0;inv=0;spd=3;combo=0;shield=0;magnet=0;shake=0}
init();
function zone(){return score<30?0:score<80?1:2}
const ZN=[['#4fc3f7','#01579b','المياه الضحلة'],['#26c6da','#00695c','الشعاب المرجانية'],['#1a237e','#020410','الأعماق المظلمة']];
function spawn(){
 if(Math.random()<.2){obs.push({t:'o',x:W+30,y:45+Math.random()*(WY-90),r:16,k:'ring',v:spd});return}
 const r=Math.random(),y=WY+45+Math.random()*(H-WY-140),z=zone();
 if(r<.36)obs.push({t:'🐚',x:W+30,y,r:16,k:'s',v:spd});
 else if(r<.44)obs.push({t:'⭐',x:W+30,y,r:16,k:'star',v:spd*1.1});
 else if(r<.49)obs.push({t:'🫧',x:W+30,y,r:17,k:'sh',v:spd});
 else if(r<.54)obs.push({t:'🧲',x:W+30,y,r:17,k:'mg',v:spd});
 else if(r<.76)obs.push({t:'🪼',x:W+30,y,r:18,k:'bad',v:spd*.9,w:Math.random()*6});
 else if(r<.9||z===0)obs.push({t:'🦈',x:W+40,y,r:26,k:'bad',v:spd*1.5,warn:35});
 else obs.push({t:'🐙',x:W+30,y,r:24,k:'bad',v:spd,w:Math.random()*6,big:1});
}
function pop(t,X,Y,c){fx.push({t,x:X,y:Y,l:40,c:c||'#fff'})}
function press(e){e.preventDefault();hold=true;if(st!=='play'){if(st==='over')init();st='play';beep(500,.1)}}
function rel(e){hold=false}
cv.addEventListener('pointerdown',press);window.addEventListener('pointerup',rel);
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!hold)press(e)});
window.addEventListener('keyup',e=>{if(e.code==='Space')rel(e)});
function txt(s,px,X,Y,col){x.font='bold '+px+'px system-ui,sans-serif';x.textAlign='center';x.fillStyle=col||'#fff';x.fillText(s,X,Y)}
const rnd=(n)=>{const v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v)};
function ell(X,Y,rx,ry,col,rot){x.beginPath();x.ellipse(X,Y,rx,ry,rot||0,0,7);x.fillStyle=col;x.fill()}
function swimmer(){
 const t=fr/5,a=Math.max(-.5,Math.min(.5,p.vy/9))+p.fl,sp=hold?1:.45;
 x.save();x.translate(p.x,p.y);x.rotate(a);
 x.lineCap='round';
 // legs
 x.strokeStyle='#0d2b52';x.lineWidth=7;
 for(let i=0;i<2;i++){const k=Math.sin(t*sp*2+i*Math.PI)*8;x.beginPath();x.moveTo(-14,0);x.lineTo(-30,k);x.stroke();ell(-33,k,5,2.5,'#ffb300',.3*k/8)}
 // back arm
 x.strokeStyle='#e0a37a';x.lineWidth=5;
 const ar=t*sp,ax=Math.cos(ar)*16,ay=Math.sin(ar)*12;
 x.beginPath();x.moveTo(8,-2);x.lineTo(8+ax,ay);x.stroke();
 // torso
 ell(-2,0,19,8,'#1565c0');ell(-2,2,17,4,'rgba(0,0,0,.2)');
 // front arm
 x.strokeStyle='#f1b58c';x.lineWidth=5;
 const br=ar+Math.PI,bx=Math.cos(br)*16,by=Math.sin(br)*12;
 x.beginPath();x.moveTo(8,1);x.lineTo(8+bx,by);x.stroke();
 // head, cap, goggles
 ell(21,-1,8,8,'#f1b58c');
 x.beginPath();x.arc(21,-2,8.5,Math.PI*.95,Math.PI*2.05);x.fillStyle='#e53935';x.fill();
 ell(26,-1,3.2,2.6,'#263238');
 x.restore();
 // trail bubbles
 if(st==='play'&&fr%4===0&&p.y>WY+8)bub.push({x:p.x-30,y:p.y+(Math.random()*10-5),r:1.5+Math.random()*2.5,v:.8+Math.random()*.8,tmp:1});
}
function splash(v){for(let i=0;i<16;i++)dr.push({x:p.x+Math.random()*30-8,y:WY,vx:Math.random()*3-1,vy:-Math.abs(v)*.5*Math.random()-1,l:30})}
function ringItem(o){x.save();x.translate(o.x,o.y);x.lineWidth=5;x.strokeStyle='#ffc107';x.beginPath();x.ellipse(0,0,10,16,0,0,7);x.stroke();x.strokeStyle='#fff3b0';x.lineWidth=1.5;x.stroke();x.restore()}
function jelly(o){
 const t=fr/10+o.w,pu=Math.sin(t)*3;
 x.save();x.translate(o.x,o.y);
 x.strokeStyle='rgba(255,160,200,.55)';x.lineWidth=2;
 for(let i=-3;i<=3;i++){x.beginPath();x.moveTo(i*5,4);for(let j=1;j<=6;j++)x.lineTo(i*5+Math.sin(t*1.5+j+i)*3,4+j*5);x.stroke()}
 const g=x.createRadialGradient(0,-6,2,0,0,22);g.addColorStop(0,'rgba(255,220,240,.9)');g.addColorStop(1,'rgba(240,98,146,.6)');
 x.beginPath();x.ellipse(0,0,19+pu*.4,14-pu*.3,0,Math.PI,0);x.lineTo(19,4);x.quadraticCurveTo(0,8,-19,4);x.closePath();x.fillStyle=g;x.fill();
 x.restore();
}
function shark(o){
 x.save();x.translate(o.x,o.y);x.scale(-1,1);
 const g=x.createLinearGradient(0,-16,0,16);g.addColorStop(0,'#546e7a');g.addColorStop(.55,'#78909c');g.addColorStop(.56,'#eceff1');g.addColorStop(1,'#cfd8dc');
 x.beginPath();x.moveTo(-42,0);x.quadraticCurveTo(-18,-20,18,-12);x.quadraticCurveTo(34,-6,44,2);
 x.quadraticCurveTo(26,4,20,10);x.quadraticCurveTo(-10,18,-34,6);
 const tw=Math.sin(fr/6)*5;
 x.lineTo(-58,16+tw);x.lineTo(-44,2);x.lineTo(-56,-16+tw);x.lineTo(-42,0);x.closePath();x.fillStyle=g;x.fill();
 x.beginPath();x.moveTo(-10,-14);x.lineTo(-2,-32);x.lineTo(10,-12);x.fillStyle='#455a64';x.fill();
 x.beginPath();x.moveTo(0,8);x.lineTo(10,22);x.lineTo(14,8);x.fillStyle='#90a4ae';x.fill();
 ell(30,-3,2.5,2.5,'#111');x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1.5;x.beginPath();x.moveTo(44,2);x.quadraticCurveTo(34,6,24,4);x.stroke();
 x.restore();
}
function octo(o){
 const t=fr/9+o.w;x.save();x.translate(o.x,o.y);
 x.strokeStyle='#7b1fa2';x.lineWidth=5;x.lineCap='round';
 for(let i=0;i<6;i++){x.beginPath();x.moveTo(-14+i*5.6,8);for(let j=1;j<=6;j++)x.lineTo(-14+i*5.6+Math.sin(t*1.6+j*.9+i)*5,8+j*5);x.stroke()}
 const g=x.createRadialGradient(-4,-8,3,0,0,24);g.addColorStop(0,'#ba68c8');g.addColorStop(1,'#6a1b9a');
 x.beginPath();x.ellipse(0,-2,19,20,0,0,7);x.fillStyle=g;x.fill();
 ell(-7,2,4,5,'#fff');ell(7,2,4,5,'#fff');ell(-7,3,2,3,'#111');ell(7,3,2,3,'#111');
 x.restore();
}
function shell(o){
 x.save();x.translate(o.x,o.y);x.rotate(Math.sin(fr/20+o.y)*.15);
 const g=x.createRadialGradient(0,2,2,0,2,18);g.addColorStop(0,'#fff1e6');g.addColorStop(1,'#f48fb1');
 x.beginPath();x.moveTo(0,12);x.bezierCurveTo(-24,4,-18,-16,0,-14);x.bezierCurveTo(18,-16,24,4,0,12);x.fillStyle=g;x.fill();
 x.strokeStyle='rgba(173,20,87,.45)';x.lineWidth=1.2;
 for(let i=-3;i<=3;i++){x.beginPath();x.moveTo(0,12);x.lineTo(i*5.5,-12+Math.abs(i));x.stroke()}
 ell(0,13,5,3,'#f8bbd0');x.restore();
}
function starfish(o){
 x.save();x.translate(o.x,o.y);x.rotate(fr/60);x.beginPath();
 for(let i=0;i<10;i++){const r=i%2?7:18,a=i*Math.PI/5;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
 x.closePath();x.fillStyle='#ffa000';x.fill();x.strokeStyle='#ffe082';x.lineWidth=2;x.stroke();
 for(let i=0;i<5;i++)ell(Math.cos(i*1.2566)*9,Math.sin(i*1.2566)*9,1.5,1.5,'#fff3c4');
 x.restore();
}
function bubbleItem(o){
 x.beginPath();x.arc(o.x,o.y,16,0,7);x.fillStyle='rgba(179,229,252,.3)';x.fill();x.strokeStyle='#e1f5fe';x.lineWidth=2;x.stroke();
 ell(o.x-6,o.y-6,4,2.5,'rgba(255,255,255,.9)',-.7);
}
function magnetItem(o){
 x.save();x.translate(o.x,o.y);x.lineCap='butt';x.lineWidth=7;
 x.strokeStyle='#e53935';x.beginPath();x.arc(0,0,10,Math.PI,0,true);x.stroke();
 x.beginPath();x.moveTo(-10,0);x.lineTo(-10,10);x.moveTo(10,0);x.lineTo(10,10);x.stroke();
 x.strokeStyle='#eceff1';x.beginPath();x.moveTo(-10,6);x.lineTo(-10,11);x.moveTo(10,6);x.lineTo(10,11);x.stroke();x.restore();
}
function drawObs(o){
 if(o.k==='ring')ringItem(o);else if(o.k==='s')shell(o);else if(o.k==='star')starfish(o);else if(o.k==='sh')bubbleItem(o);else if(o.k==='mg')magnetItem(o);
 else if(o.t==='🪼')jelly(o);else if(o.t==='🦈')shark(o);else octo(o);
}
function env(z){
 // light rays
 const ra=[.16,.1,.04][z];
 for(let i=0;i<5;i++){const bx=((i*95+fr*.25)%(W+120))-60;x.beginPath();x.moveTo(bx,WY);x.lineTo(bx+35,WY);x.lineTo(bx-40,H);x.lineTo(bx-95,H);x.closePath();x.fillStyle=`rgba(255,255,255,${ra})`;x.fill()}
 // distant fish silhouettes (parallax)
 for(let i=0;i<5;i++){const fx0=W-((fr*(.4+i*.12)+i*140)%(W+80))+40,fy=80+rnd(i+3)*(H-260)+Math.sin(fr/40+i)*6;
  x.fillStyle='rgba(0,40,80,.22)';x.beginPath();x.ellipse(fx0,fy,12,5,0,0,7);x.fill();x.beginPath();x.moveTo(fx0+10,fy);x.lineTo(fx0+19,fy-5);x.lineTo(fx0+19,fy+5);x.fill()}
 // surface
 const SK=[['#5ec2ff','#e3f6ff'],['#ff9e6d','#ffe2b8'],['#0b1033','#2a2f6b']][z],sk=x.createLinearGradient(0,0,0,WY);
 sk.addColorStop(0,SK[0]);sk.addColorStop(1,SK[1]);
 x.beginPath();x.moveTo(0,0);x.lineTo(W,0);for(let i=W;i>=0;i-=10)x.lineTo(i,WY+Math.sin(i/22+fr/20)*4);x.closePath();x.fillStyle=sk;x.fill();
 ell(285,48,z===2?14:20,z===2?14:20,z===2?'#f5f5dc':'#fff4a8');
 for(let i=0;i<3;i++){const cx=((i*150-fr*.3)%(W+120)+W+120)%(W+120)-60,cy=38+i*30;x.fillStyle=z===2?'rgba(120,130,180,.4)':'rgba(255,255,255,.85)';[[0,0,22,9],[-16,3,14,7],[17,3,16,7]].forEach(c=>{x.beginPath();x.ellipse(cx+c[0],cy+c[1],c[2],c[3],0,0,7);x.fill()})}
 x.beginPath();for(let i=0;i<=W;i+=10){const yy=WY+Math.sin(i/22+fr/20)*4;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=2;x.stroke();
 // seabed
 const sg=x.createLinearGradient(0,H-55,0,H);sg.addColorStop(0,['#e6c98f','#c9b27a','#3b3a4f'][z]);sg.addColorStop(1,['#b8975f','#8a7650','#17172a'][z]);
 x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=10)x.lineTo(i,H-40+Math.sin(i/37+1)*6+Math.sin(i/13)*2);x.lineTo(W,H);x.closePath();x.fillStyle=sg;x.fill();
 for(let i=0;i<7;i++){const rx=((i*70-fr*1.3)%(W+80)+W+80)%(W+80)-20,sz=6+rnd(i)*8;ell(rx,H-24+rnd(i+9)*10,sz*1.5,sz,'rgba(70,60,50,.55)')}
 // seaweed
 if(z>=1)for(let i=0;i<9;i++){const sx=((i*48-fr*1.3)%(W+60)+W+60)%(W+60)-15;x.strokeStyle=z===1?'#2e7d32':'#1b5e20';x.lineWidth=4;x.lineCap='round';x.beginPath();x.moveTo(sx,H-30);for(let j=1;j<=6;j++)x.lineTo(sx+Math.sin(fr/25+j*.7+i)*5*j/3,H-30-j*10);x.stroke()}
}
function hit(o){
 if(o.k==='ring'){score+=3;pop('+3 🪙',o.x,o.y,'#ffd54f');beep(950,.12);return}
 if(o.k==='bad'){
  if(inv)return;combo=0;
  if(shield){shield=0;inv=40;beep(300,.15);pop('🫧 تحطّم الدرع',p.x,p.y-30);return}
  lives--;inv=80;shake=14;beep(120,.3,'sawtooth');try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  if(lives<=0){st='over';if(score>best){best=score;try{localStorage.setItem('swimBest',best)}catch(e){}}}
  return;
 }
 if(o.k==='sh'){shield=1;pop('🫧 درع!',o.x,o.y,'#b3e5fc');beep(700,.2);return}
 if(o.k==='mg'){magnet=300;pop('🧲 مغناطيس!',o.x,o.y,'#ffcc80');beep(600,.2);return}
 combo=Math.min(combo+1,25);const m=1+Math.floor(combo/5),v=(o.k==='star'?5:1)*m;
 score+=v;pop('+'+v+(m>1?' ×'+m:''),o.x,o.y,m>1?'#ffeb3b':'#fff');beep(700+combo*25,.1);
}
function loop(){
 const z=zone(),zz=ZN[z],g=x.createLinearGradient(0,WY,0,H);g.addColorStop(0,zz[0]);g.addColorStop(1,zz[1]);
 x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake--}
 x.fillStyle=g;x.fillRect(-10,-10,W+20,H+20);
 env(z);
 for(let i=bub.length-1;i>=0;i--){const b=bub[i];b.y-=b.v;b.x+=Math.sin(b.y/15)*.4-(b.tmp?1.2:.3);
  if(b.tmp&&(b.y<WY||b.x<-10)){bub.splice(i,1);continue}
  if(!b.tmp){if(b.y<WY){b.y=H+10;b.x=Math.random()*W}if(b.x<-10)b.x=W}
  x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=1;x.stroke();ell(b.x-b.r*.3,b.y-b.r*.3,b.r*.25,b.r*.25,'rgba(255,255,255,.6)')}
 if(st==='play'){
  fr++;spd=3+Math.min(score/45,3.2);
  const wasA=p.y<WY;
  if(wasA){p.vy+=.42;p.af++;p.fl+=.16}else{p.vy+=hold?-.55-.12*Math.sin(fr/5):.38;p.vy*=.95;p.fl*=.8}
  p.y+=p.vy;
  if(p.y<12){p.y=12;p.vy=0}if(p.y>H-58){p.y=H-58;p.vy=-.5}
  const isA=p.y<WY;
  if(wasA&&!isA){splash(p.vy);if(p.af>22){const bn=Math.floor(p.af/12);score+=bn;pop('قفزة! +'+bn,p.x+10,WY-20,'#ffeb3b');beep(880,.2)}p.af=0;p.vy*=.4}
  if(!wasA&&isA){splash(p.vy);beep(420,.12);p.af=0}
  if(fr%Math.max(26,58-Math.floor(spd*4))===0)spawn();
  if(inv>0)inv--;if(magnet>0)magnet--;
  for(let i=obs.length-1;i>=0;i--){
   const o=obs[i];
   if(o.warn>0){o.warn--;o.x=W+40;continue}
   o.x-=o.v;if(o.w!==undefined)o.y+=Math.sin(fr/12+o.w)*(o.big?2.2:1.5);
   if(o.k==='s'||o.k==='star')o.y+=Math.sin(fr/18+i)*.4;
   if(magnet&&(o.k==='s'||o.k==='star')){const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy);if(d<170){o.x+=dx/d*4;o.y+=dy/d*4}}
   if(Math.hypot(o.x-p.x,o.y-p.y)<o.r+13){hit(o);if(o.k!=='bad')obs.splice(i,1);if(st!=='play')break;continue}
   if(o.x<-60)obs.splice(i,1);
  }
 }
 obs.forEach(o=>{if(o.warn>0){txt('❗',26,W-20,o.y+9,'#ff5252');return}drawObs(o)});
 if(z===2){const lg=x.createRadialGradient(p.x,p.y,40,p.x,p.y,190);lg.addColorStop(0,'rgba(0,0,0,0)');lg.addColorStop(1,'rgba(0,0,10,.82)');x.fillStyle=lg;x.fillRect(0,0,W,H)}
 if(!(inv>0&&fr%6<3)){swimmer();if(shield){x.beginPath();x.arc(p.x,p.y,30,0,7);x.fillStyle='rgba(179,229,252,.28)';x.fill();x.strokeStyle='#e1f5fe';x.lineWidth=2;x.stroke()}}
 dr=dr.filter(d=>d.l>0);dr.forEach(d=>{d.l--;d.vy+=.3;d.x+=d.vx;d.y+=d.vy;x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(d.x,d.y,2,0,7);x.fill()});
 if(magnet){x.fillStyle='#ffcc80';x.fillRect(0,H-5,W*magnet/300,5)}
 fx=fx.filter(f=>f.l>0);fx.forEach(f=>{f.l--;f.y-=1;x.globalAlpha=f.l/40;txt(f.t,18,f.x,f.y,f.c);x.globalAlpha=1});
 x.restore();
 txt('🐚 '+score,20,60,30);txt('❤️'.repeat(Math.max(lives,0)),18,W-55,30);
 txt(zz[2],12,W/2,22,'rgba(255,255,255,.85)');if(combo>=5)txt('تتابع ×'+(1+Math.floor(combo/5)),15,W/2,44,'#ffeb3b');
 if(st==='ready'){x.fillStyle='rgba(0,0,0,.4)';x.fillRect(0,H/2-80,W,170);txt('اضغط لتبدأ السباحة!',26,W/2,H/2-15);txt('أفضل نتيجة: '+best,16,W/2,H/2+20);txt('اقفز من الماء لتجمع الحلقات 🪙',13,W/2,H/2+55)}
