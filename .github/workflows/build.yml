name: Build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name SwimGame --add-data "swim-game.html;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SwimGame-windows
          path: dist/SwimGame
